[package]
name = "stormnic-ixgbe"
description = "Rust no_std UEFI EFI_SIMPLE_NETWORK driver for Intel 10G, loaded by stormbootx from its boot media"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "stormnic-ixgbe"
path = "src/main.rs"

[features]
# Print the whole bring-up trace on the console at every boot (#22). Without
# it the trace is printed only when the EFI variable StormnicVerbose is set
# (src/console.rs).
verbose = []

[dependencies]
uefi = { version = "0.39", features = ["alloc", "global_allocator", "panic_handler", "logger"] }
uefi-raw = "0.15"
# Only to cap the uefi crate's logger (#8); log 0.4 is already in the lock through uefi.
log = "0.4"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
